[project]
name = "ana"
version = "0.0.1"
description = "Ana - waifu virtual assistant for Hyprland/Linux (Phase 0: chat CLI)"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[project.scripts]
ana = "ana.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "textual>=0.86", "numpy>=1.26"]
# Phase 2 voice (opt-in, local-only). Bounds kept permissive; see README
# "Voice (Phase 2)". Not installed by default — install with: pip install -e '.[voice]'
voice = ["faster-whisper>=1.0", "piper-tts"]
# Phase 4 TUI (opt-in). install with: pip install -e '.[tui]'
tui = ["textual>=0.86"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ana*"]
